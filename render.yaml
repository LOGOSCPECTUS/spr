# Render Blueprint (Infrastructure as Code).
# Docs: https://render.com/docs/blueprint-spec
#
# Build compiles TypeScript to dist/ (dist/ is gitignored, so Render must build
# it). Start runs the compiled entry via `npm start` (-> node dist/server.js).
services:
  - type: web
    name: smart-payment-recovery
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Secrets — set these in the Render dashboard (sync:false keeps them out of git).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      # Optional
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEFAULT_ACCOUNT_ID
        sync: false
